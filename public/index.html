<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Chatbot</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="chat-container">

        <h1>Botz LLm's</h1>

        <!-- Chat Messages -->
        <div id="chat-box"></div>

        <!-- Input Area -->
        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Ask something..."
            >

            <button id="send-btn">
                Send
            </button>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
